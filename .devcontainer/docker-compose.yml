services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    environment:
      - CMD_DB_URL=postgres://codimd:codimd@localhost/codimd
      - CMD_USECDN=false
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Share the database network so the app can connect on localhost.
    network_mode: service:db

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres-17-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=codimd
      - POSTGRES_PASSWORD=codimd
      - POSTGRES_DB=codimd

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  node_modules:
  postgres-17-data:
